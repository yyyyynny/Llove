<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>별바다 세계 · 끝말잇기</title>
  <!--
    별바다 세계 (wchain) — Llove의 이세계(끝말잇기 게임 차원) 진입점.
    Phase 1: 아직 게임 로직 없음 — "준비 중" 안내 + 학습 세계로 돌아가기.
    같은 GitHub Pages·같은 도메인이라 구글 로그인은 자동 공유(추후 Firebase 배선).
    상세 설계는 wchain/시스템.md 참조.
  -->
  <style>
    /* 별바다 = 밤하늘·별. Llove 본체와 분리된 독립 진입점이라 최소 스타일만 자체 보유.
       회전 애니메이션은 '잇' 퍼즐(게임 본질)에서만 쓰고, 여기 장식은 불투명도 펄스만(회전 금지 준수). */
    :root{ --bg:#0a0c18; --star:#dfe6ff; --acc:#8fa8ff; --txt:#e8ecff; --txt2:#95a0c8; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      background:
        radial-gradient(1200px 600px at 70% -10%, #1a2140 0%, transparent 60%),
        radial-gradient(900px 500px at 10% 110%, #141a35 0%, transparent 55%),
        var(--bg);
      color:var(--txt);
      font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100dvh; text-align:center; padding:24px; overflow:hidden; position:relative;
    }
    /* 별 몇 점 — 불투명도만 깜빡임(수직·수평·회전 아님) */
    .star{ position:fixed; width:2px; height:2px; border-radius:50%; background:var(--star);
      opacity:.5; animation:twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle{ 0%,100%{opacity:.25} 50%{opacity:.9} }
    .badge{ font-size:12px; letter-spacing:2px; color:var(--acc); text-transform:uppercase; margin-bottom:14px; }
    h1{ font-size:30px; font-weight:900; letter-spacing:1px; margin-bottom:8px;
      background:linear-gradient(180deg,#ffffff,#a9b8ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .sub{ font-size:13px; color:var(--txt2); margin-bottom:28px; }
    .note{ font-size:14px; color:var(--txt); background:rgba(143,168,255,.08);
      border:1px solid rgba(143,168,255,.22); border-radius:14px; padding:16px 20px; max-width:340px; line-height:1.7; }
    .back{ margin-top:26px; display:inline-block; font-size:13px; color:var(--acc);
      text-decoration:none; border:1px solid rgba(143,168,255,.3); border-radius:999px; padding:9px 18px;
      transition:background .2s,transform .2s; }
    .back:hover{ background:rgba(143,168,255,.12); transform:translateY(-1px); }
  </style>
</head>
<body>
  <!-- 장식용 별 (JS 없이 정적 배치) -->
  <div class="star" style="top:18%;left:22%"></div>
  <div class="star" style="top:30%;left:78%;animation-delay:.6s"></div>
  <div class="star" style="top:64%;left:14%;animation-delay:1.1s"></div>
  <div class="star" style="top:72%;left:82%;animation-delay:1.7s"></div>
  <div class="star" style="top:44%;left:52%;animation-delay:2.2s"></div>

  <div class="badge">✦ 별바다 세계 ✦</div>
  <h1>끝말잇기</h1>
  <div class="sub">Dark Fantasy Edition</div>
  <div class="note">
    🌌 이 세계는 아직 <b>준비 중</b>입니다.<br>
    별의 문은 열렸지만, 안쪽은 곧 채워집니다.
  </div>
  <a class="back" href="../">← 학습 세계로 돌아가기</a>
</body>
</html>
