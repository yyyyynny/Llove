<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>잇는 · 끝말잇기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
  <!--
    '잇는'(임시 이름 — 최종 미정) — Llove의 이세계(끝말잇기 게임 차원) 진입점.
    Phase 1: 아직 게임 로직 없음 — "준비 중" 안내 + 학습 세계로 돌아가기.
    같은 GitHub Pages·같은 도메인이라 구글 로그인은 자동 공유(추후 Firebase 배선).
    상세 설계는 wchain/시스템.md 참조.
  -->
  <style>
    /* Llove 본체와 분리된 독립 진입점이라 최소 스타일만 자체 보유.
       회전 애니메이션은 '잇' 퍼즐(게임 본질)에서만 허용 — 여기 장식엔 사용하지 않는다. */
    :root{ --bg:#0e1016; --panel:#151824; --acc:#9db0d8; --txt:#e6e9f2; --txt2:#8b93a8; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      background:radial-gradient(700px 500px at 50% 8%, #171b28 0%, var(--bg) 70%);
      color:var(--txt);
      font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100dvh; text-align:center; padding:24px;
    }
    .badge{ font-size:12px; letter-spacing:4px; color:var(--acc); margin-bottom:14px; }
    h1{ font-size:30px; font-weight:900; letter-spacing:1px; margin-bottom:8px;
      background:linear-gradient(180deg,#ffffff,#aab6d8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .sub{ font-size:13px; color:var(--txt2); margin-bottom:28px; }
    .note{ font-size:14px; color:var(--txt); background:var(--panel);
      border:1px solid rgba(157,176,216,.22); border-radius:14px; padding:16px 20px; max-width:340px; line-height:1.7; }
    .back{ margin-top:26px; display:inline-block; font-size:13px; color:var(--acc);
      text-decoration:none; border:1px solid rgba(157,176,216,.3); border-radius:999px; padding:9px 18px;
      transition:background .2s,transform .2s; }
    .back:hover{ background:rgba(157,176,216,.12); transform:translateY(-1px); }
  </style>
</head>
<body>
  <div class="badge">잇 는</div>
  <h1>끝말잇기</h1>
  <div class="sub">Dark Fantasy Edition</div>
  <div class="note">
    이 세계는 아직 <b>준비 중</b>입니다.<br>
    문은 이어졌지만, 안쪽은 곧 채워집니다.
  </div>
  <a class="back" href="../Llove/">← 학습 세계로 돌아가기</a>

  <!-- Phase 2: 한글 엔진(사전+두음법칙+탐색+한방) — 파이썬 원본과 전수 대조 완료(12/12).
       클래식 스크립트·전역 공유(Llove와 동일 원칙). 사전 → 엔진 순서 고정.
       게임 본체(상태 머신·모드)는 Phase 3~4에서 이 위에 얹는다. -->
  <script src="js/사전.js"></script>
  <script src="js/엔진.js"></script>
</body>
</html>
